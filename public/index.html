<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador - Área de Influencia</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-gradient-start: #0a0d14;
            --bg-gradient-end: #121824;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #14b8a6;
            --accent-hover: #0d9488;
            --accent-glow: rgba(20, 184, 166, 0.25);
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 50%, var(--bg-gradient-end) 0%, var(--bg-gradient-start) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative background glows */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            z-index: 0;
            filter: blur(40px);
            animation: pulse 12s infinite alternate;
            pointer-events: none;
        }

        .glow-orb-1 {
            top: -100px;
            left: -100px;
        }

        .glow-orb-2 {
            bottom: -150px;
            right: -100px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            animation-delay: 2s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(30px, 20px); opacity: 0.8; }
        }

        .container {
            width: 100%;
            max-width: 640px;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .geo-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .geo-btn:hover {
            color: var(--accent-hover);
        }

        .geo-btn i {
            width: 14px;
            height: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .input-icon i {
            width: 20px;
            height: 20px;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 16px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(255, 255, 255, 0.04);
        }

        .presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .preset-badge {
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .preset-badge:hover {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }

        button.search-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        button.search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%);
        }

        button.search-btn:active {
            transform: translateY(0);
        }

        button.search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Result Area */
        .result-container {
            margin-top: 32px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
        }

        .result-container.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .copy-btn:hover {
            background: rgba(20, 184, 166, 0.08);
            color: var(--accent-hover);
        }

        .copy-btn i {
            width: 14px;
            height: 14px;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-left: 4px solid var(--primary);
        }

        .result-box.empty {
            border-left-color: var(--text-secondary);
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Shimmer loading skeleton */
        .skeleton {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.03) 25%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 75%
            );
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-text {
            height: 16px;
            margin-bottom: 8px;
        }
        .skeleton-text:last-child {
            width: 70%;
            margin-bottom: 0;
        }

        /* Notification toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            width: 16px;
            height: 16px;
        }

        .toast.toast-error {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .toast.toast-error i {
            color: var(--error);
        }

        .toast.toast-success i {
            color: var(--success);
        }

        /* Spinner animation */
        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-container">
                    <i data-lucide="map-pin" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h1>Área de Influencia</h1>
                <p class="subtitle">Encuentra direcciones numeradas en un radio de 100 metros</p>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="coords">Coordenadas (Latitud, Longitud)</label>
                    <button class="geo-btn" onclick="obtenerUbicacion()">
                        <i data-lucide="locate"></i> Usar mi ubicación
                    </button>
                </div>
                <div class="input-wrapper">
                    <div class="input-icon">
                        <i data-lucide="compass"></i>
                    </div>
                    <input type="text" id="coords" placeholder="Ej: 36.7213, -4.4214" value="36.7213, -4.4214">
                </div>
            </div>

            <div class="presets">
                <span class="preset-badge" onclick="aplicarPreset('36.7213, -4.4214')">Málaga Centro</span>
                <span class="preset-badge" onclick="aplicarPreset('36.608761, -4.519520')">Benalmádena</span>
                <span class="preset-badge" onclick="aplicarPreset('40.416775, -3.703790')">Madrid Sol</span>
                <span class="preset-badge" onclick="aplicarPreset('41.385064, 2.173403')">Barcelona Centro</span>
            </div>

            <button class="search-btn" id="searchBtn" onclick="buscar()">
                <i data-lucide="search" id="btnIcon"></i>
                <span id="btnText">Buscar Área de Influencia</span>
            </button>

            <!-- Result -->
            <div class="result-container" id="resultContainer">
                <div class="result-header">
                    <span class="result-label">Resultados</span>
                    <button class="copy-btn" id="copyBtn" onclick="copiarAlPortapapeles()" style="display: none;">
                        <i data-lucide="copy" id="copyIcon"></i>
                        <span id="copyText">Copiar resultado</span>
                    </button>
                </div>
                <div class="result-box" id="resultado"></div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <i id="toastIcon" data-lucide="info"></i>
        <span id="toastMsg">Mensaje</span>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        let rawResultText = "";

        function aplicarPreset(coordenadas) {
            document.getElementById('coords').value = coordenadas;
            showToast("Preset aplicado con éxito", "success");
        }

        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.innerText = message;
            toast.className = `toast show ${type === 'error' ? 'toast-error' : type === 'success' ? 'toast-success' : ''}`;
            
            // Update icon
            if (type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
            } else if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle');
            } else {
                toastIcon.setAttribute('data-lucide', 'info');
            }
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function obtenerUbicacion() {
            if (!navigator.geolocation) {
                showToast("La geolocalización no es compatible con este navegador.", "error");
                return;
            }

            showToast("Obteniendo ubicación actual...", "info");
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    document.getElementById('coords').value = `${lat}, ${lon}`;
                    showToast("Ubicación cargada correctamente.", "success");
                },
                (error) => {
                    let errMsg = "Error al obtener la ubicación.";
                    if (error.code === error.PERMISSION_DENIED) {
                        errMsg = "Permiso de ubicación denegado por el usuario.";
                    }
                    showToast(errMsg, "error");
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        async function buscar() {
            const coordsInput = document.getElementById('coords').value.trim();
            // Remove multiple spaces, normalize commas
            const cleanCoords = coordsInput.replace(/\s+/g, '');
            
            if (!cleanCoords || !cleanCoords.includes(',')) {
                showToast("Formato incorrecto. Por favor introduce: latitud, longitud", "error");
                return;
            }

            const searchBtn = document.getElementById('searchBtn');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            const resultContainer = document.getElementById('resultContainer');
            const resultado = document.getElementById('resultado');
            const copyBtn = document.getElementById('copyBtn');

            // Setup loading state
            searchBtn.disabled = true;
            btnText.innerText = "Consultando...";
            btnIcon.setAttribute('data-lucide', 'loader-2');
            btnIcon.classList.add('spinner');
            lucide.createIcons();

            // Reveal result box with skeletons
            resultContainer.classList.add('show');
            copyBtn.style.display = "none";
            resultado.className = "result-box";
            resultado.innerHTML = `
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
            `;

            try {
                const response = await fetch(`/dir/${cleanCoords}`);
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Error en la petición");
                }
                
                rawResultText = await response.text();
                
                // Display result
                resultado.innerText = rawResultText;
                
                // Check if we found address or empty message
                if (rawResultText.toLowerCase().includes("no se encontraron") || rawResultText.length === 0) {
                    resultado.classList.add('empty');
                    copyBtn.style.display = "none";
                } else {
                    copyBtn.style.display = "flex";
                }

                showToast("Búsqueda finalizada con éxito", "success");
            } catch (err) {
                console.error(err);
                resultado.innerText = "Error: " + err.message;
                resultado.classList.add('empty');
                showToast("No se pudo obtener el área de influencia.", "error");
            } finally {
                // Reset button state
                searchBtn.disabled = false;
                btnText.innerText = "Buscar Área de Influencia";
                btnIcon.setAttribute('data-lucide', 'search');
                btnIcon.classList.remove('spinner');
                lucide.createIcons();
            }
        }

        async function copiarAlPortapapeles() {
            if (!rawResultText) return;

            const copyIcon = document.getElementById('copyIcon');
            const copyText = document.getElementById('copyText');

            try {
                await navigator.clipboard.writeText(rawResultText);
                showToast("Copiado al portapapeles", "success");
                
                // Change UI state momentarily
                copyIcon.setAttribute('data-lucide', 'check');
                copyText.innerText = "¡Copiado!";
                lucide.createIcons();
                
                setTimeout(() => {
                    copyIcon.setAttribute('data-lucide', 'copy');
                    copyText.innerText = "Copiar resultado";
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                showToast("Error al copiar al portapapeles", "error");
            }
        }
    </script>
</body>
</html>
