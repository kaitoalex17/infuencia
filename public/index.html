<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador - Área de Influencia</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-gradient-start: #0a0d14;
            --bg-gradient-end: #121824;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --primary-glow: rgba(99, 102, 241, 0.35);
            --accent: #14b8a6;
            --accent-hover: #0d9488;
            --accent-glow: rgba(20, 184, 166, 0.25);
            --error: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at 50% 50%, var(--bg-gradient-end) 0%, var(--bg-gradient-start) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Decorative background glows */
        .glow-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            z-index: 0;
            filter: blur(40px);
            animation: pulse 12s infinite alternate;
            pointer-events: none;
        }

        .glow-orb-1 {
            top: -100px;
            left: -100px;
        }

        .glow-orb-2 {
            bottom: -150px;
            right: -100px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            animation-delay: 2s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(30px, 20px); opacity: 0.8; }
        }

        .container {
            width: 100%;
            max-width: 640px;
            z-index: 1;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            margin-bottom: 16px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.3);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #ffffff, #d1d5db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 24px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .geo-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .geo-btn:hover {
            color: var(--accent-hover);
        }

        .geo-btn i {
            width: 14px;
            height: 14px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: var(--text-secondary);
            pointer-events: none;
        }

        .input-icon i {
            width: 20px;
            height: 20px;
        }

        input {
            width: 100%;
            padding: 16px 16px 16px 48px;
            font-size: 16px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            font-family: inherit;
            transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
            background: rgba(255, 255, 255, 0.04);
        }

        button.search-btn {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        button.search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
            background: linear-gradient(135deg, var(--primary-hover) 0%, var(--primary) 100%);
        }

        button.search-btn:active {
            transform: translateY(0);
        }

        button.search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Result Area */
        .result-container {
            margin-top: 32px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
        }

        .result-container.show {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .result-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .copy-btn {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
        }

        .copy-btn:hover {
            background: rgba(20, 184, 166, 0.08);
            color: var(--accent-hover);
        }

        .copy-btn i {
            width: 14px;
            height: 14px;
        }

        .result-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            font-weight: 500;
            white-space: pre-wrap;
            word-wrap: break-word;
            border-left: 4px solid var(--primary);
        }

        .result-box.empty {
            border-left-color: var(--text-secondary);
            color: var(--text-secondary);
            font-style: italic;
        }

        /* Shimmer loading skeleton */
        .skeleton {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.03) 25%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 75%
            );
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .skeleton-text {
            height: 16px;
            margin-bottom: 8px;
        }
        .skeleton-text:last-child {
            width: 70%;
            margin-bottom: 0;
        }

        /* Notification toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: #1e293b;
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            gap: 8px;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            pointer-events: none;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast i {
            width: 16px;
            height: 16px;
        }

        .toast.toast-error {
            border-color: rgba(239, 68, 68, 0.3);
        }

        .toast.toast-error i {
            color: var(--error);
        }

        .toast.toast-success i {
            color: var(--success);
        }

        /* Spinner animation */
        .spinner {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Interactive Results UI */
        .interactive-section {
            margin-top: 24px;
            border-top: 1px solid var(--card-border);
            padding-top: 24px;
        }

        .interactive-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 16px;
        }

        .street-group {
            margin-bottom: 16px;
        }

        .street-group:last-child {
            margin-bottom: 0;
        }

        .street-name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .street-name i {
            width: 14px;
            height: 14px;
            color: var(--primary);
        }

        .portals-list {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .portal-pill {
            padding: 6px 14px;
            background: rgba(99, 102, 241, 0.05);
            border: 1px solid rgba(99, 102, 241, 0.15);
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
            font-family: inherit;
        }

        .portal-pill:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .portal-pill i {
            width: 12px;
            height: 12px;
            opacity: 0.7;
        }

        /* Modal de Detalles Catastrales */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 1000;
        }

        .modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #0d111a;
            border: 1px solid var(--card-border);
            border-radius: 20px;
            width: 90%;
            max-width: 550px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            overflow: hidden;
        }

        .modal-overlay.show .modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-header {
            padding: 24px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .modal-header h2 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .modal-ref-catastral {
            font-size: 13px;
            color: var(--accent);
            font-weight: 600;
            margin-top: 4px;
            font-family: monospace;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .close-btn i {
            width: 20px;
            height: 20px;
        }

        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* Tabs */
        .modal-tabs {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--card-border);
            padding: 4px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.25);
        }

        .modal-loading {
            padding: 40px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .spinner-container {
            display: inline-flex;
            animation: spin 1s linear infinite;
        }

        .modal-error {
            padding: 30px 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .units-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .unit-item {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: border-color 0.2s;
        }

        .unit-item:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .unit-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .unit-desc {
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-container">
                    <i data-lucide="map-pin" style="color: white; width: 32px; height: 32px;"></i>
                </div>
                <h1>Área de Influencia</h1>
                <p class="subtitle">Encuentra direcciones numeradas en un radio de 100 metros</p>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="coords">Coordenadas (Latitud, Longitud)</label>
                    <button class="geo-btn" onclick="obtenerUbicacion()">
                        <i data-lucide="locate"></i> Usar mi ubicación
                    </button>
                </div>
                <div class="input-wrapper">
                    <div class="input-icon">
                        <i data-lucide="compass"></i>
                    </div>
                    <input type="text" id="coords" placeholder="Ej: 36.7213, -4.4214" value="">
                </div>
            </div>

            <button class="search-btn" id="searchBtn" onclick="buscar()">
                <i data-lucide="search" id="btnIcon"></i>
                <span id="btnText">Buscar Área de Influencia</span>
            </button>

            <!-- Result -->
            <div class="result-container" id="resultContainer">
                <div class="result-header">
                    <span class="result-label">Resultados</span>
                    <button class="copy-btn" id="copyBtn" onclick="copiarAlPortapapeles()" style="display: none;">
                        <i data-lucide="copy" id="copyIcon"></i>
                        <span id="copyText">Copiar resultado</span>
                    </button>
                </div>
                <div class="result-box" id="resultado"></div>
                
                <!-- Interactive grid of street groups and portal buttons -->
                <div id="interactiveResults" class="interactive-section" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalles Catastrales -->
    <div id="detailsModal" class="modal-overlay" onclick="closeModalOnOutsideClick(event)">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h2 id="modalAddress">Calle Pincarrasco 42</h2>
                    <p id="modalRefCatastral" class="modal-ref-catastral">RC: cargando...</p>
                </div>
                <button class="close-btn" onclick="closeModal()">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- Tabs -->
                <div class="modal-tabs">
                    <button class="tab-btn active" id="tabViviendas" onclick="switchTab('Viviendas')">Viviendas (<span id="countViviendas">0</span>)</button>
                    <button class="tab-btn" id="tabLocales" onclick="switchTab('Locales')">Locales (<span id="countLocales">0</span>)</button>
                    <button class="tab-btn" id="tabOtros" onclick="switchTab('Otros')">Otros/Anexos (<span id="countOtros">0</span>)</button>
                </div>
                
                <!-- Loading -->
                <div id="modalLoading" class="modal-loading">
                    <div class="spinner-container">
                        <i data-lucide="loader-2" class="spinner" style="width: 32px; height: 32px; color: var(--primary);"></i>
                    </div>
                    <p>Consultando desglose catastral del portal...</p>
                </div>
                
                <!-- Content grid -->
                <div id="modalContent" style="display: none;">
                    <div id="unitsList" class="units-grid">
                        <!-- Generado dinámicamente -->
                    </div>
                </div>
                
                <!-- Error -->
                <div id="modalError" class="modal-error" style="display: none;">
                    <i data-lucide="alert-circle" style="color: var(--error); width: 32px; height: 32px;"></i>
                    <p id="modalErrorMsg">Error al consultar el Catastro.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">
        <i id="toastIcon" data-lucide="info"></i>
        <span id="toastMsg">Mensaje</span>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        let rawResultText = "";
        let activeTab = 'Viviendas';
        let currentBuildingUnits = [];

        function showToast(message, type = "info") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');
            
            toastMsg.innerText = message;
            toast.className = `toast show ${type === 'error' ? 'toast-error' : type === 'success' ? 'toast-success' : ''}`;
            
            // Update icon
            if (type === 'error') {
                toastIcon.setAttribute('data-lucide', 'alert-circle');
            } else if (type === 'success') {
                toastIcon.setAttribute('data-lucide', 'check-circle');
            } else {
                toastIcon.setAttribute('data-lucide', 'info');
            }
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function obtenerUbicacion() {
            if (!navigator.geolocation) {
                showToast("La geolocalización no es compatible con este navegador.", "error");
                return;
            }

            showToast("Obteniendo ubicación actual...", "info");
            
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude.toFixed(6);
                    const lon = position.coords.longitude.toFixed(6);
                    document.getElementById('coords').value = `${lat}, ${lon}`;
                    showToast("Ubicación cargada correctamente.", "success");
                },
                (error) => {
                    let errMsg = "Error al obtener la ubicación.";
                    if (error.code === error.PERMISSION_DENIED) {
                        errMsg = "Permiso de ubicación denegado por el usuario.";
                    }
                    showToast(errMsg, "error");
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

        async function buscar() {
            const coordsInput = document.getElementById('coords').value.trim();
            const cleanCoords = coordsInput.replace(/\s+/g, '');
            
            if (!cleanCoords || !cleanCoords.includes(',')) {
                showToast("Formato incorrecto. Por favor introduce: latitud, longitud", "error");
                return;
            }

            const searchBtn = document.getElementById('searchBtn');
            const btnIcon = document.getElementById('btnIcon');
            const btnText = document.getElementById('btnText');
            const resultContainer = document.getElementById('resultContainer');
            const resultado = document.getElementById('resultado');
            const copyBtn = document.getElementById('copyBtn');
            const interactiveResults = document.getElementById('interactiveResults');

            // Setup loading state
            searchBtn.disabled = true;
            btnText.innerText = "Consultando...";
            btnIcon.setAttribute('data-lucide', 'loader-2');
            btnIcon.classList.add('spinner');
            lucide.createIcons();

            // Reveal result box with skeletons
            resultContainer.classList.add('show');
            interactiveResults.style.display = "none";
            copyBtn.style.display = "none";
            resultado.className = "result-box";
            resultado.innerHTML = `
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
                <div class="skeleton skeleton-text"></div>
            `;

            try {
                // Hacemos el fetch en formato JSON para obtener las coordenadas de cada portal
                const response = await fetch(`/dir/${cleanCoords}?format=json`);
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(errorText || "Error en la petición");
                }
                
                const data = await response.json();
                rawResultText = data.resultado;
                
                // Display result text
                resultado.innerText = rawResultText;
                
                // Render portals list below it
                renderInteractiveResults(data.direcciones);
                
                // Check if we found address or empty message
                if (rawResultText.toLowerCase().includes("no se encontraron") || rawResultText.length === 0) {
                    resultado.classList.add('empty');
                    copyBtn.style.display = "none";
                } else {
                    copyBtn.style.display = "flex";
                }

                showToast("Búsqueda finalizada con éxito", "success");
            } catch (err) {
                console.error(err);
                resultado.innerText = "Error: " + err.message;
                resultado.classList.add('empty');
                showToast("No se pudo obtener el área de influencia.", "error");
            } finally {
                // Reset button state
                searchBtn.disabled = false;
                btnText.innerText = "Buscar Área de Influencia";
                btnIcon.setAttribute('data-lucide', 'search');
                btnIcon.classList.remove('spinner');
                lucide.createIcons();
            }
        }

        function renderInteractiveResults(direcciones) {
            const container = document.getElementById('interactiveResults');
            container.innerHTML = '';
            
            if (!direcciones || direcciones.length === 0) {
                container.style.display = 'none';
                return;
            }
            
            container.style.display = 'block';
            
            // Agrupar por calle
            const agrupado = {};
            direcciones.forEach(d => {
                if (!agrupado[d.calle]) {
                    agrupado[d.calle] = [];
                }
                agrupado[d.calle].push(d);
            });
            
            // Generar HTML
            let html = '<div class="interactive-title">Desglose Físico (Haz clic en un portal para ver pisos y locales)</div>';
            
            for (const calle in agrupado) {
                // Ordenar números
                const portales = agrupado[calle].sort((a, b) => {
                    const numA = parseInt(a.numero.toString().replace(/\D/g, '')) || 0;
                    const numB = parseInt(b.numero.toString().replace(/\D/g, '')) || 0;
                    return numA - numB;
                });
                
                html += `
                    <div class="street-group">
                        <div class="street-name">
                            <i data-lucide="navigation-2"></i> ${calle}
                        </div>
                        <div class="portals-list">
                `;
                
                portales.forEach(p => {
                    html += `
                        <button class="portal-pill" onclick="abrirDetallePortal(${p.lat}, ${p.lon}, '${calle.replace(/'/g, "\\'")}', '${p.numero}')">
                            ${p.numero} <i data-lucide="chevron-right"></i>
                        </button>
                    `;
                });
                
                html += `
                        </div>
                    </div>
                `;
            }
            
            container.innerHTML = html;
            lucide.createIcons();
        }

        async function abrirDetallePortal(lat, lon, calle, numero) {
            const modal = document.getElementById('detailsModal');
            const modalAddress = document.getElementById('modalAddress');
            const modalRefCatastral = document.getElementById('modalRefCatastral');
            const modalLoading = document.getElementById('modalLoading');
            const modalContent = document.getElementById('modalContent');
            const modalError = document.getElementById('modalError');
            
            // Configurar cabecera inicial
            modalAddress.innerText = `${calle} ${numero}`;
            modalRefCatastral.innerText = 'Cargando referencia catastral...';
            
            // Mostrar modal y loading
            modal.classList.add('show');
            modalLoading.style.display = 'flex';
            modalContent.style.display = 'none';
            modalError.style.display = 'none';
            
            try {
                const response = await fetch(`/catastro/detalles?lat=${lat}&lon=${lon}`);
                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.details || "Error al obtener datos catastrales");
                }
                
                const data = await response.json();
                
                // Actualizar info con los datos reales
                modalAddress.innerText = data.direccionOficial;
                modalRefCatastral.innerText = `RC: ${data.refCatastral}`;
                
                currentBuildingUnits = data.unidades || [];
                
                // Forzar pestaña Viviendas por defecto al abrir
                activeTab = 'Viviendas';
                document.getElementById('tabViviendas').classList.add('active');
                document.getElementById('tabLocales').classList.remove('active');
                document.getElementById('tabOtros').classList.remove('active');

                // Renderizar
                renderUnits();
                
                // Ocultar loading, mostrar contenido
                modalLoading.style.display = 'none';
                modalContent.style.display = 'block';
                
            } catch (err) {
                console.error(err);
                modalLoading.style.display = 'none';
                modalError.style.display = 'flex';
                document.getElementById('modalErrorMsg').innerText = `Error Catastro: ${err.message}`;
            }
        }

        function renderUnits() {
            // Contar unidades por categoría
            const viviendas = currentBuildingUnits.filter(u => u.categoria === 'Viviendas');
            const locales = currentBuildingUnits.filter(u => u.categoria === 'Locales');
            const otros = currentBuildingUnits.filter(u => u.categoria === 'Otros' || u.categoria === 'Anexos');
            
            document.getElementById('countViviendas').innerText = viviendas.length;
            document.getElementById('countLocales').innerText = locales.length;
            document.getElementById('countOtros').innerText = otros.length;
            
            // Filtrar las unidades de la pestaña activa
            const activeList = currentBuildingUnits.filter(u => {
                if (activeTab === 'Viviendas') return u.categoria === 'Viviendas';
                if (activeTab === 'Locales') return u.categoria === 'Locales';
                return u.categoria === 'Otros' || u.categoria === 'Anexos';
            });
            
            const grid = document.getElementById('unitsList');
            grid.innerHTML = '';
            
            if (activeList.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-secondary); padding: 30px; font-size: 14px;">No se encontraron elementos en esta categoría.</div>`;
                return;
            }
            
            activeList.forEach(u => {
                // Formatear descripción
                let descDetalle = [];
                if (u.escalera) descDetalle.push(`Esc: ${u.escalera}`);
                if (u.planta) {
                    let p = u.planta;
                    if (p === '00' || p === 'BJ' || p === 'PB') p = 'Baja';
                    descDetalle.push(`Planta: ${p}`);
                }
                if (u.puerta) descDetalle.push(`Pta: ${u.puerta}`);
                
                const title = descDetalle.join(' | ') || 'Finca Única';
                
                grid.innerHTML += `
                    <div class="unit-item">
                        <div class="unit-title">${title}</div>
                        <div class="unit-desc">${u.tipo}</div>
                    </div>
                `;
            });
        }

        function switchTab(tab) {
            document.getElementById('tabViviendas').classList.remove('active');
            document.getElementById('tabLocales').classList.remove('active');
            document.getElementById('tabOtros').classList.remove('active');
            
            document.getElementById(`tab${tab}`).classList.add('active');
            activeTab = tab;
            
            renderUnits();
        }

        function closeModal() {
            document.getElementById('detailsModal').classList.remove('show');
        }

        function closeModalOnOutsideClick(event) {
            if (event.target.id === 'detailsModal') {
                closeModal();
            }
        }

        async function copiarAlPortapapeles() {
            if (!rawResultText) return;

            const copyIcon = document.getElementById('copyIcon');
            const copyText = document.getElementById('copyText');

            try {
                await navigator.clipboard.writeText(rawResultText);
                showToast("Copiado al portapapeles", "success");
                
                // Change UI state momentarily
                copyIcon.setAttribute('data-lucide', 'check');
                copyText.innerText = "¡Copiado!";
                lucide.createIcons();
                
                setTimeout(() => {
                    copyIcon.setAttribute('data-lucide', 'copy');
                    copyText.innerText = "Copiar resultado";
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                showToast("Error al copiar al portapapeles", "error");
            }
        }
    </script>
</body>
</html>
